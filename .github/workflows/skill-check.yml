name: skill-check

on:
  push:
    paths: ['improve/**']
  pull_request:
    paths: ['improve/**']
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python audit (structure / encoding / triggers / links / token budget)
        run: python3 improve/scripts/audit.py improve

      - name: Shell syntax check
        run: |
          bash -n improve/scripts/detect-lang.sh
          bash -n improve/scripts/sync.sh

      - name: Core workflow smoke — SKILL.md links & reference graph
        run: |
          set -euo pipefail
          # SKILL.md 内相对链接必须能解析到 improve/ 下的真实文件
          grep -oE '\]\([^)]+\)' improve/SKILL.md | tr -d '][()' | grep -vE '^(https?://|#)' | \
            while read -r p; do
              tgt="${p%%#*}"
              [ -z "$tgt" ] && continue
              [ -e "improve/$tgt" ] || { echo "SKILL.md 断链: $tgt"; exit 1; }
            done
          echo "SKILL.md link smoke OK"
